apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-backend
  namespace: dwp-dev
  labels:
    app: blog-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-backend
  template:
    metadata:
      labels:
        app: blog-backend
    spec:
      containers:
        - name: blog-backend
          image: blog-service:latest
          #image: 850756192530.dkr.ecr.us-east-1.amazonaws.com/dwp/blog:v1.0.11
          ports:
           - containerPort: 9090
          env:
          - name: SPRING_DATASOURCE_URL
            value: jdbc:postgresql://localhost:5432/blogdb?serverTimezone=UTC
          - name: SPRING_DATASOURCE_USERNAME
            value: bloguser
          - name: SPRING_DATASOURCE_PASSWORD
            value: bloguser
          - name: SERVER_PORT
            value: "9090"



            