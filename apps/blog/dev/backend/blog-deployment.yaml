apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-backend
  namespace: dwp-dev
  labels:
    app: blog-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-backend
  template:
    metadata:
      labels:
        app: blog-backend
    spec:
      containers:
        - name: blog-backend
          image: 850756192530.dkr.ecr.us-east-1.amazonaws.com/dwp/np/blog:1.2.0-SNAPSHOT-5b8a6eb9f63cfd03f8c827a8f6db22da79f0b6de
          ports:
           - containerPort: 9090
          env:
          - name: SPRING_DATASOURCE_URL
            value: jdbc:postgresql://dwp-platform-nonprod.ch8cowcymvme.eu-west-1.rds.amazonaws.com:5432/devblogdb?serverTimezone=UTC
          - name: SPRING_DATASOURCE_USERNAME
            value: devuser
          - name: SPRING_DATASOURCE_PASSWORD
            value: devuser
          - name: SERVER_PORT
            value: "9090"



            