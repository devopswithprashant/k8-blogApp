apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-backend
  namespace: dwp-qa
  labels:
    app: blog-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: blog-backend
  template:
    metadata:
      labels:
        app: blog-backend
    spec:
      containers:
        - name: blog-backend
          image: 850756192530.dkr.ecr.us-east-1.amazonaws.com/dwp/np/blog:1.3.0-SNAPSHOT-f024499eaa2bfe3c4b674ab820010705b5f4cb18
          ports:
           - containerPort: 9090
          env:
          - name: SPRING_DATASOURCE_URL
            value: jdbc:postgresql://dwp-platform-nonprod.ch8cowcymvme.eu-west-1.rds.amazonaws.com:5432/qablogdb?serverTimezone=UTC
          - name: SPRING_DATASOURCE_USERNAME
            value: qauser
          - name: SPRING_DATASOURCE_PASSWORD
            value: qauser
          - name: SERVER_PORT
            value: "9090"



            