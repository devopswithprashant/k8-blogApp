apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-backend
  namespace: dwp-qa
  labels:
    app: blog-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-backend
  template:
    metadata:
      labels:
        app: blog-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: blog-backend
          image: 850756192530.dkr.ecr.us-east-1.amazonaws.com/dwp/np/blog:1.4.1-SNAPSHOT-ccef785d7edb2a0fab8625fa51a0d6f4cce0d6f5
          ports:
           - containerPort: 8080
          env:
          - name: SPRING_DATASOURCE_URL
            value: jdbc:postgresql://dwp-platform-nonprod.ch8cowcymvme.eu-west-1.rds.amazonaws.com:5432/qablogdb?serverTimezone=UTC
          - name: SPRING_DATASOURCE_USERNAME
            value: qauser
          - name: SPRING_DATASOURCE_PASSWORD
            value: qauser
          - name: SERVER_PORT
            value: "8080"



            