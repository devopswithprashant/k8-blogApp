elasticsearch:
  replicas: 1
  protocol: http
  createCert: false 
  esConfig:
    elasticsearch.yml: |
      cluster.name: "minikube-elk"
      network.host: "0.0.0.0"
      xpack.security.enabled: false
      xpack.monitoring.enabled: false
  esJavaOpts: "-Xmx2g -Xms2g"
  resources:
    requests:
      cpu: "1000m"
      memory: "3Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  volumeClaimTemplate:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: "10Gi"
  antiAffinity: "soft"
  persistence:
    enabled: true
